name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - pyproject.toml
      - imagehub/__init__.py
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check the distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      # A tag must match the version in pyproject.toml and imagehub/__init__.py.
      - name: Check the tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import os, re, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          module = re.search(r'__version__ = "([^"]+)"', open("imagehub/__init__.py").read())[1]
          tag = os.environ["TAG"]
          assert tag == f"v{version}" == f"v{module}", (tag, version, module)
          EOF

      # Install the wheel into a clean environment and run the README quickstart imports.
      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/smoke/bin/python -m pip install "$(ls dist/*.whl)[image]"
          cd /tmp
          /tmp/smoke/bin/python -c "import imagehub; from imagehub import pipeline; from imagehub.catalog import model_info; print(imagehub.__version__, model_info('sd-v1-5').repo_id)"
          /tmp/smoke/bin/python -m imagehub.pretrained --help > /dev/null

      - name: Upload the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/imagehub/
    permissions:
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # Trusted publishing: PyPI accepts the upload from this workflow and environment only.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
