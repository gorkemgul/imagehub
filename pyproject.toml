[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "imagehub"
version = "0.1.0"
description = "Open-weight image generation architectures, natively reimplemented in PyTorch with parity evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 AND LicenseRef-NVIDIA-NSCLv1"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "licenses/*", "licenses/**/*"]
authors = [{ name = "gorkemgul" }]
dependencies = ["torch>=2.2"]
keywords = ["artificial-intelligence", "diffusion", "image-generation", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/gorkemgul/imagehub"
Repository = "https://github.com/gorkemgul/imagehub"
Documentation = "https://github.com/gorkemgul/imagehub/tree/main/docs"
Issues = "https://github.com/gorkemgul/imagehub/issues"

[project.optional-dependencies]
image = ["pillow>=10"]
reference = [
  "diffusers==0.40.0",
  "transformers==5.18.0",
  "peft==0.21.2",
  "torchvision",
  "sentencepiece",
  "protobuf",
  "scipy",
]
docs = ["mkdocs-material>=9.5", "mkdocs-static-i18n>=1.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.13", "build>=1.2"]

[tool.hatch.build.targets.sdist]
only-include = [
  "imagehub",
  "tests",
  "LICENSE",
  "NOTICE",
  "THIRD_PARTY_NOTICES.md",
  "licenses",
  "README.md",
  "pyproject.toml",
  "docs/catalog.md",
  "docs/models.md",
  "docs/validation.md",
  "docs/validation.json",
  "examples",
]

[tool.hatch.build.targets.wheel]
packages = ["imagehub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
markers = [
  "reference: optional comparison against upstream implementations",
  "mps: requires Apple MPS",
  "cuda: requires CUDA",
  "restricted_fixture: requires checkpoint material that is not redistributed",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# ruff >= 0.16 also formats Python blocks inside Markdown; docs keep their own layout.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["imagehub"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
